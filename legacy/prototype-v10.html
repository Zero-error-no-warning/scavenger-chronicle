/* map quality patch v2 */
.cell{
  overflow:hidden;
  text-shadow:0 1px 2px #000c;
  background:linear-gradient(180deg,#132238,#0b1522);
  border:1px solid #355173;
  box-shadow:inset 0 1px 0 #ffffff12, inset 0 -8px 18px #0005;
}
.cell.road,.cell.loc-road,.cell.loc-station,.cell.loc-campbase{
  background:linear-gradient(180deg,#596170,#2a313d);
  border-color:#a8b7ca;
  box-shadow:inset 0 0 0 1px #d5e0ef22, inset 0 -8px 18px #0005;
}
.cell.edge,.cell.loc-mart,.cell.loc-apart,.cell.loc-clinic,.cell.loc-mall,.cell.loc-home{
  background:linear-gradient(180deg,#3b669a,#1b3455);
  border-color:#8bc0ff;
  box-shadow:inset 0 0 0 1px #b7dcff22, inset 0 -8px 18px #0004;
}
.cell.foot,.cell.loc-forest,.cell.loc-farm,.cell.loc-shrine{
  background:linear-gradient(180deg,#378043,#18421f);
  border-color:#89e298;
  box-shadow:inset 0 0 0 1px #c5ffcc22, inset 0 -8px 18px #0004;
}
.cell.rough,.cell.loc-camp{
  background:linear-gradient(180deg,#9a6633,#522f14);
  border-color:#efb172;
  box-shadow:inset 0 0 0 1px #ffd8b122, inset 0 -8px 18px #0004;
}
.cell.loc-river{
  background:linear-gradient(180deg,#2c88d6,#15486f);
  border-color:#8fd8ff;
  box-shadow:inset 0 0 0 1px #c9ecff22, inset 0 -8px 18px #0004;
}
.cell.loc-factory,.cell.loc-warehouse{
  background:linear-gradient(180deg,#6a717b,#373c43);
  border-color:#c3ccd9;
}
.cell.loc-lab,.cell.blocked{
  background:linear-gradient(180deg,#943949,#481720);
  border-color:#ff9dac;
  box-shadow:inset 0 0 0 1px #ffc0c722, inset 0 -8px 18px #0004;
}
.cell.unknown{
  background:linear-gradient(180deg,#111922,#0a1017);
  opacity:.5;
  filter:saturate(.18);
  border-color:#243446;
}
.cell.cur{box-shadow:0 0 0 2px var(--g) inset,0 0 20px #f0c76b66}
.cell.reach{outline:2px solid #7fc0ff88}
.cell.danger{color:#ffd0cb}
.cell.danger:after{
  content:"!";
  position:absolute;
  right:4px;top:2px;
  font-size:.68rem;
  color:#ff8f84;
  font-weight:900;
  text-shadow:0 1px 3px #000;
}

/* boundary-based traversal map */
.map{
  gap:0!important;
  background:#172431;
  border:1px solid #304353;
  border-radius:10px;
  overflow:hidden;
}
.cell{
  border-radius:0!important;
  border:1px solid #1d2b36!important;
  background:#0b1521;
  overflow:visible;
}
.cell.road:before,.cell.foot:before,.cell.rough:before,.cell.blocked:before,.cell.edge:before{
  content:none!important;
}
.cell.cur{z-index:4}
.edgeMark{
  position:absolute;
  pointer-events:none;
  z-index:5;
  opacity:.92;
  --edge:#dfe9f1;
}
.edgeMark.e{right:-3px;top:-1px;bottom:-1px;width:6px}
.edgeMark.s{left:-1px;right:-1px;bottom:-3px;height:6px}
.edgeMark.e.edge-pass:not(.edge-foot){border-right:2px dotted var(--edge)}
.edgeMark.s.edge-pass:not(.edge-foot){border-bottom:2px dotted var(--edge)}
.edgeMark.e.edge-blocked{border-right:5px double var(--edge)}
.edgeMark.s.edge-blocked{border-bottom:5px double var(--edge)}
.edgeMark.e.edge-obstacle{
  width:5px;
  background:radial-gradient(circle at 50% 3px, transparent 0 2px, var(--edge) 2.3px 3.2px, transparent 3.4px) repeat-y;
  background-size:5px 8px;
}
.edgeMark.s.edge-obstacle{
  height:5px;
  background:radial-gradient(circle at 3px 50%, transparent 0 2px, var(--edge) 2.3px 3.2px, transparent 3.4px) repeat-x;
  background-size:8px 5px;
}
.edge-fast{--edge:#9ed8ff}
.edge-mid{--edge:#bff6a2}
.edge-slow{--edge:#ffe38f}
.edge-hard{--edge:#ffad6b}
.edge-very{--edge:#ff7272}
.edge-unknown{opacity:.16}
.cell .locIcon{z-index:2}
.cell .locLabel{z-index:2}
.mapLegend{
  display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;font-size:.62rem;color:var(--m)
}
.mapLegend span{display:inline-flex;align-items:center;gap:4px;border:1px solid #31485e;border-radius:999px;padding:2px 6px;background:#08131d}
.legendLine{width:16px;height:0;border-bottom:2px dotted #9ed8ff;display:inline-block}
.legendLine.block{border-bottom:5px double #ff7272}
.legendLine.obs{height:5px;border:0;background:radial-gradient(circle at 3px 50%, transparent 0 2px, #ffe38f 2.3px 3.2px, transparent 3.4px) repeat-x;background-size:8px 5px}


/* boundary semantics v2 */
.edgeMark.e.edge-pass.edge-cart{border-right:2px dotted var(--edge)}
.edgeMark.s.edge-pass.edge-cart{border-bottom:2px dotted var(--edge)}
.edgeMark.e.edge-pass.edge-foot{border-right:2px solid var(--edge)}
.edgeMark.s.edge-pass.edge-foot{border-bottom:2px solid var(--edge)}
.edgeMark.e.edge-obstacle,
.edgeMark.s.edge-obstacle{filter:drop-shadow(0 0 3px rgba(255,180,80,.25))}
.edgeObstacleCard{border-color:#9a7937;background:linear-gradient(#211a0e,#14110c)}

/* ===== game HUD v10 : structural overhaul ===== */
@media (max-width: 700px){
  html,body{background:#030507}
  #game{
    position:relative;
    display:block;
    width:100%;
    height:100dvh;
    max-width:none;
    padding:0;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 25%,rgba(35,66,94,.22),transparent 42%),
      linear-gradient(180deg,#05090d,#020406 68%,#010203);
  }

  /* top HUD floats over the world instead of taking a card row */
  .top{
    position:absolute;z-index:8;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 6px);
    height:42px;display:grid;grid-template-columns:1fr 94px;gap:6px;pointer-events:auto;
  }
  .top .title,.top .sys{height:42px}
  .top .title{
    border-radius:7px;
    border:1px solid rgba(136,172,205,.46);
    background:linear-gradient(180deg,rgba(13,22,32,.94),rgba(5,10,16,.9));
    box-shadow:0 10px 20px #0009,inset 0 1px 0 #ffffff12;
    padding:0 10px;
  }
  .top .title b{font-size:.78rem;letter-spacing:.08em}
  .top .title small{display:none}
  .top .title span{font-size:.62rem}
  .sys{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .sys button{min-height:0;height:42px;border-radius:7px;font-size:.64rem;padding:0}

  /* compact six-stat tactical ribbon */
  .hud{
    position:absolute;z-index:7;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 53px);
    height:50px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;
    pointer-events:none;
  }
  .meter{
    min-width:0;height:50px;border-radius:5px;padding:4px 4px 3px;
    background:linear-gradient(180deg,rgba(13,23,33,.9),rgba(5,10,16,.84));
    border:1px solid rgba(126,167,206,.28);box-shadow:0 6px 14px #0008;
  }
  .meter label{display:block;font-size:.47rem;line-height:1.05;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meter label span:first-child{display:block;color:#8da8c1;margin-bottom:2px}
  .meter label span:last-child{display:block;font-size:.72rem;font-weight:900;color:#f2f8ff}
  .bar{height:4px;margin-top:3px;border-radius:1px}

  /* world/map becomes the screen */
  .play{
    position:absolute;z-index:1;left:0;right:0;top:0;bottom:0;display:block;min-height:0;
  }
  .mapPanel{
    position:absolute;inset:0;padding:112px 8px 150px;
    border:0;border-radius:0;box-shadow:none;background:transparent;overflow:hidden;
  }
  .mapPanel::before{display:none}
  .place{
    position:absolute;z-index:4;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 108px);
    display:block;padding:8px 10px;border:1px solid rgba(126,167,206,.28);border-radius:5px;
    background:linear-gradient(180deg,rgba(8,15,22,.86),rgba(4,8,13,.78));
    box-shadow:0 8px 18px #0008;backdrop-filter:blur(5px)
  }
  #locName{font-size:.82rem;letter-spacing:.03em}
  #locMeta{font-size:.48rem;margin-top:2px;opacity:.82}
  .objectiveLine{font-size:.58rem;margin-top:3px;padding:0;background:none;border:0}

  .map{
    position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 158px);bottom:142px;
    display:grid;grid-template:repeat(7,1fr)/repeat(7,1fr);gap:2px;padding:4px;
    border-radius:5px;border:1px solid rgba(106,146,181,.35);
    background:
      linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
      radial-gradient(circle at center,#0b151f,#04090e 72%);
    background-size:18px 18px,18px 18px,auto;
    box-shadow:0 20px 40px #000b,inset 0 0 45px #0008;
  }
  .cell{
    border-radius:2px!important;
    border:1px solid rgba(132,166,195,.35)!important;
    box-shadow:inset 0 1px 0 #ffffff0d,inset 0 -12px 18px #0005!important;
    font-size:.72rem!important;
  }
  .cell.cur{box-shadow:0 0 0 2px #f0c76b inset,0 0 16px #f0c76b66!important}
  .cell.reach{outline:1px solid #7fc0ffaa;outline-offset:-2px}
  #mapLegend{display:none}
  .side{display:none!important}

  /* field log overlays lower world */
  .event{
    position:absolute;z-index:5;left:8px;right:8px;bottom:70px;height:68px;
    padding:9px 10px 7px;border-radius:5px;
    background:linear-gradient(180deg,rgba(11,19,27,.94),rgba(4,8,13,.92));
    border:1px solid rgba(126,167,206,.34);box-shadow:0 -4px 18px #0008,0 10px 20px #0008;
    backdrop-filter:blur(7px);
  }
  .event::before{content:"FIELD LOG";top:5px;left:10px;font-size:.46rem;letter-spacing:.16em;color:#7fa7c9}
  .event h2{display:none}
  .eventText{padding-top:8px;font-size:.7rem;line-height:1.28;height:33px;overflow:hidden}
  .chips{height:18px;min-height:18px;margin-top:1px;gap:3px}
  .chip{font-size:.5rem;padding:2px 5px;border-radius:3px;max-width:120px;background:#0a121b}

  /* bottom action belt instead of HTML nav card */
  .dock{
    position:absolute;z-index:9;left:0;right:0;bottom:0;height:64px;
    display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:0 4px env(safe-area-inset-bottom);
    border:0;border-top:1px solid rgba(126,167,206,.3);border-radius:0;
    background:linear-gradient(180deg,rgba(13,21,30,.98),rgba(4,8,12,.99));
    box-shadow:0 -10px 24px #000b;
  }
  .dock::before{display:none}
  .dock button{
    height:58px;min-height:58px;border:0;border-right:1px solid rgba(126,167,206,.14);border-radius:0;
    background:transparent;box-shadow:none;padding:5px 1px 4px;color:#d8e5ef;
  }
  .dock button:last-child{border-right:0}
  .dock button:active{background:#172433;transform:none}
  .dock .i{font-size:1rem;line-height:1}
  .dock .tx{display:block;font-size:.47rem;letter-spacing:.05em;margin-top:3px;color:#9eb5c8}

  /* game windows: rectangular terminal panels */
  .overlay{padding:0;align-items:stretch;justify-content:stretch;background:rgba(1,3,6,.84);backdrop-filter:blur(8px)}
  .win{
    width:100%;height:100dvh;max-width:none;max-height:none;border:0;border-radius:0;
    grid-template-rows:48px auto 1fr 54px auto;
    background:linear-gradient(180deg,#0b121a,#05090d 64%,#020406);
    box-shadow:none;
  }
  .wh{padding:calc(env(safe-area-inset-top) + 5px) 8px 5px;border-bottom:1px solid #35506a;background:#0a1119}
  .wh h2{font-size:.78rem;letter-spacing:.11em}
  .toolbar,.foot{padding:6px 8px;border-radius:0;background:#070d13}
  .body{padding:8px;background:radial-gradient(circle at 50% 0%,rgba(43,74,103,.12),transparent 45%)}
  .miniLogAlways{padding:4px 8px;background:#03070b;border-color:#21364a}
  .miniLogAlways div{font-size:.52rem}
  .item,.statusBox,.compareBox,.partHp,.currentEquipBlock,.nextCityBlock{
    border-radius:4px!important;
    background:linear-gradient(180deg,#0e1721,#081018)!important;
    border:1px solid #38536c!important;
    box-shadow:inset 0 1px 0 #ffffff0b!important;
  }
  .item{padding:8px}
  .item b{font-size:.8rem}
  .item .m{font-size:.58rem}
  .item .d{font-size:.68rem;line-height:1.35}
  .row button{border-radius:4px;min-height:34px;font-size:.68rem}

  /* title screen now reads as a game boot screen */
  #title{padding:18px;background:
    radial-gradient(circle at 50% 20%,rgba(48,82,112,.35),transparent 34%),
    linear-gradient(180deg,#071019,#020407 70%)}
  .titleCard{width:min(520px,100%);border-radius:6px!important;padding:20px 16px;background:linear-gradient(180deg,#0e1721,#060c12)!important}
  .titleEyebrow{font-size:.54rem}
  .titleCard h1{font-size:1.85rem;letter-spacing:.1em}
  .titleCard p{font-size:.78rem;line-height:1.65}
  .titleFeatures{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .titleFeatures span{border-radius:3px;text-align:center;font-size:.56rem;padding:5px}
  .versionBadge{display:block;border-radius:3px;text-align:center;font-size:.55rem;padding:6px;margin:8px 0 10px}
  .titleBtns{grid-template-columns:1fr;gap:6px}
  .titleBtns button{border-radius:4px;min-height:46px}
  .titleHint{font-size:.56rem;text-align:center}

  /* combat gets a more dedicated screen language */
  body.combatMode .win{background:
    radial-gradient(circle at 50% 10%,rgba(120,45,38,.12),transparent 35%),
    linear-gradient(180deg,#0d1218,#05080c 70%)}
  body.combatMode .wh{border-bottom-color:#70433e;background:#100d0d}
  body.combatMode .combatFrame{grid-template-columns:82px 1fr;gap:6px}
  body.combatMode .combatSideHud,body.combatMode .enemy,body.combatMode .intentBox,body.combatMode .bodyHud{
    border-radius:3px!important;
  }
  body.combatMode .combatActions button{border-radius:3px;min-height:52px}
}

function locationIcon(loc,cls='svgIcon mapLocIcon'){const key=typeof loc==='string'?loc:(loc?.id||'empty');return svgIcon(locIcon[key]||'city',cls)}
function threatLevel(d){return d>=.7?4:d>=.5?3:d>=.3?2:d>=.15?1:0}

function timeText(){let day=Math.floor(S.min/1440)+1, mm=S.min%1440, h=Math.floor(mm/60), m=mm%60;return `${day}日目 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}

 return clamp(base+pressure+nightRisk()+fatigue+extra,.01,.92);
}

function alertClass(){let a=alertLevel();return a>=70?'bad':a>=40?'warn':'good'}
function survivalPressureHtml(){

 return `<div class="pressureStrip"><div class="pressureCell ${alertClass()}"><div class="k">周辺の気配</div><div class="v">${alertName()} ${alertLevel()}（遭遇+${Math.round(alertLevel()/2.5)/10}%）</div></div><div class="pressureCell ${isNight()&&!hasLightSource()?'warn':''}"><div class="k">時間帯</div><div class="v">${phaseName()} / ${light}</div></div><div class="pressureCell ${pack.ok?'good':'bad'}"><div class="k">携行</div><div class="v">${packTxt}</div></div></div>`;
}
function exploreModeConfig(mode){return {

function exploreYieldEstimate(spot,mode){let cfg=exploreModeConfig(mode),first=!(spot.used||spot.searches>0);if(first)return `${cfg.count+1}前後`;return mode=='quiet'?'0〜1':mode=='normal'?'0〜1':'1〜2'}
function explorePlanButtons(spot,index){return `<div class="planRow">${['quiet','normal','loud'].map(mode=>{let c=exploreModeConfig(mode),cls=mode=='quiet'?'green':mode=='normal'?'primary':'red';return `<button class="${cls}" onclick="exploreSpot(${index},'${mode}')">${c.label}<small>物資 ${exploreYieldEstimate(spot,mode)} / 総合遭遇 ${exploreRiskEstimate(spot,mode)}% / 気配 +${c.alert}</small></button>`}).join('')}</div>`}
function mapMax(){return S.map.length-1}
function edgeKey(x1,y1,x2,y2){
 return (x1<x2||y1<y2)?`${x1},${y1}-${x2},${y2}`:`${x2},${y2}-${x1},${y1}`;
}
function getEdge(x1,y1,x2,y2){
 if(!S.edges)generateEdges();

}
function accessWeight(a){return {road:0,edge:1,foot:2,rough:3,blocked:4}[a]??1}
function edgeCostClass(cost){return cost<=35?'fast':cost<=50?'mid':cost<=70?'slow':cost<=95?'hard':'very'}
function edgeStateName(st){return {pass:'通行可能',obstacle:'障害物',blocked:'通行不可'}[st]||st}
function edgeTimeColorName(cost){return cost<=35?'速い':cost<=50?'普通':cost<=70?'遅い':cost<=95?'かなり遅い':'非常に遅い'}
function edgeNeedFor(a,b){
 let ids=[a.l.id,b.l.id];
 if(ids.includes('forest')||ids.includes('farm')||ids.includes('camp'))return 'cut';
 if(ids.includes('factory')||ids.includes('warehouse')||ids.includes('road'))return 'pry';
 return chance(.5)?'pry':'disassemble';
}
function buildEdge(a,b){
 let aw=accessWeight(a.l.access), bw=accessWeight(b.l.access), w=Math.max(aw,bw);
 let state='pass';
 if(a.l.access=='blocked'||b.l.access=='blocked')state=chance(.42)?'blocked':'obstacle';
 else if(['river','forest','farm','camp','lab'].includes(a.l.id)||['river','forest','farm','camp','lab'].includes(b.l.id)){
  if(chance(.45))state='obstacle';
 }else if(w>=3&&chance(.35))state='obstacle';
 let base=[30,40,60,85,115][w]||45;
 let cart=state=='pass'&&w<=1;
 let need='';
 if(state=='obstacle'){base=80+Math.round(Math.random()*35);cart=false;need=edgeNeedFor(a,b)}
 if(state=='blocked')base=999;
 return {state,cost:base,cart,need};
}

function edgeNeighbors(x,y){let out=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{let nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<S.map.length&&ny<S.map.length)out.push({nx,ny,e:getEdge(x,y,nx,ny)})});return out}
function floodEdges(allowObstacle=false){
 let start={x:S.p?.x??8,y:S.p?.y??8},q=[start],seen=new Set([`${start.x},${start.y}`]);
 while(q.length){let p=q.shift();for(const n of edgeNeighbors(p.x,p.y)){if(n.e.state=='blocked'||(!allowObstacle&&n.e.state!='pass'))continue;let k=`${n.nx},${n.ny}`;if(!seen.has(k)){seen.add(k);q.push({x:n.nx,y:n.ny})}}}
 return seen;
}
function ensureMapConnectivity(){
 if(!S.map?.length||!S.edges)return;
 // Permanent double lines must never make an area impossible forever.
 let eventual=floodEdges(true),total=S.map.length*S.map.length,guard=0;
 while(eventual.size<total&&guard++<total*3){
  let changed=false;
  for(const key of [...eventual]){let [x,y]=key.split(',').map(Number);for(const n of edgeNeighbors(x,y)){let nk=`${n.nx},${n.ny}`;if(eventual.has(nk))continue;if(n.e.state=='blocked'){n.e.state='obstacle';n.e.need=n.e.need||edgeNeedFor(S.map[y][x],S.map[n.ny][n.nx]);n.e.cost=90;n.e.cart=false;changed=true;break}}if(changed)break}
  if(!changed)break;eventual=floodEdges(true);
 }
 // At least a useful starting district is open without a tool; obstacles remain as shortcuts/gates farther out.
 let open=floodEdges(false),target=Math.min(total,72),guard2=0;
 while(open.size<target&&guard2++<total*2){
  let candidates=[];
  for(const key of open){let [x,y]=key.split(',').map(Number);for(const n of edgeNeighbors(x,y)){let nk=`${n.nx},${n.ny}`;if(!open.has(nk)&&n.e.state=='obstacle')candidates.push(n.e)}}
  if(!candidates.length)break;let e=pick(candidates);e.state='pass';e.cost=Math.max(45,Math.round((e.cost||90)*.65));e.cart=false;e.cleared=true;open=floodEdges(false);
 }
}
function generateEdges(){
 S.edges={};
 if(!S.map||!S.map.length)return;
 for(let y=0;y<S.map.length;y++){
  for(let x=0;x<S.map[y].length;x++){
   let t=S.map[y][x];
   if(x<S.map[y].length-1)S.edges[edgeKey(x,y,x+1,y)]=buildEdge(t,S.map[y][x+1]);
   if(y<S.map.length-1)S.edges[edgeKey(x,y,x,y+1)]=buildEdge(t,S.map[y+1][x]);
  }
 }
 // keep the starting area readable
 [[8,8,9,8],[8,8,7,8],[8,8,8,9],[8,8,8,7]].forEach(([x1,y1,x2,y2])=>{
  if(x2>=0&&y2>=0&&x2<S.map.length&&y2<S.map.length)S.edges[edgeKey(x1,y1,x2,y2)]={state:'pass',cost:30,cart:true};
 });
 ensureMapConnectivity();
}
function edgeCanMove(e){return e&&e.state=='pass'}
function moveMinutes(l,e=null){
 let base=e?e.cost:({road:30,edge:40,foot:60,rough:90,blocked:120}[l.access]||45);
 if(vehicleActiveHere()&&e&&e.cart)base-=10;
 else if(vehicleActiveHere()&&!e&&(l.access=='road'||l.access=='edge'))base-=10;
 if(legPenalty()>0)base+=legPenalty()*20;
 return Math.max(20,base);
}
function edgeMarkup(t,dir){
 let nx=t.x+(dir=='e'?1:0), ny=t.y+(dir=='s'?1:0);
 if(nx>mapMax()||ny>mapMax())return '';
 let n=S.map[ny][nx];
 let e=getEdge(t.x,t.y,nx,ny);
 let seen=t.seen&&n.seen;
 let mode=e.state=='pass'?(e.cart?'edge-cart':'edge-foot'):'';
 let cls=`edgeMark ${dir} edge-${e.state} ${mode} edge-${edgeCostClass(e.cost)} ${seen?'':'edge-unknown'}`;
 let title=e.state=='blocked'?'通行不可':e.state=='obstacle'?`障害物 / ${objectNeedLabel(e.need||'pry')}で撤去`: `${e.cart?'車両可':'徒歩のみ'} / ${edgeTimeColorName(e.cost)} ${e.cost}分`;
 return `<span class="${cls}" title="${title}"></span>`;
}

 return `<div class="routeList">${rows.join('')}</div>`;

function limbLabel(k){return {head:'頭',torso:'胴体',larm:'左腕',rarm:'右腕',lleg:'左脚',rleg:'右脚'}[k]||k}
const BODY_MAX={head:14,torso:34,larm:16,rarm:16,lleg:16,rleg:16}
function partRatio(k){return clamp((S.body[k]??BODY_MAX[k])/BODY_MAX[k],0,1)}
function limbAvgRatio(){return (partRatio('larm')+partRatio('rarm')+partRatio('lleg')+partRatio('rleg'))/4}
function derivedHealth(){return Math.round(100*Math.cbrt(partRatio('head')*partRatio('torso')*limbAvgRatio()))}
function syncHealth(){
 S.body=S.body||clone(BODY_MAX);
 Object.keys(BODY_MAX).forEach(k=>{if(S.body[k]===undefined)S.body[k]=BODY_MAX[k];S.body[k]=clamp(S.body[k],0,BODY_MAX[k])});

}
function partText(k){return `${Math.round(S.body[k])}/${BODY_MAX[k]}`}
function armPenalty(){return (partRatio('larm')<.45?1:0)+(partRatio('rarm')<.45?1:0)}
function legPenalty(){return (partRatio('lleg')<.45?1:0)+(partRatio('rleg')<.45?1:0)}
function bodyHit(dmg){let parts=['head','torso','larm','rarm','lleg','rleg'];let p=pick(parts);let mult=(p=='head'?0.75:p=='torso'?1.25:1);let actual=Math.max(1,Math.round(dmg*mult));S.body[p]=clamp(S.body[p]-actual,0,BODY_MAX[p]);syncHealth();return `${limbLabel(p)}-${actual}`}
function partClassByKey(k){let r=partRatio(k);return r>=.7?'ok':r>=.35?'warn':'bad'}
function bodyPictogram(){return `<div class="humanPanel"><div class="humanIcon">${Object.entries(S.body).map(([k,v])=>`<div class="node ${k} ${partClassByKey(k)}" style="--hp:${Math.round(partRatio(k)*100)}%"><span>${Math.round(partRatio(k)*100)}</span></div>`).join('')}</div><div><div class="item"><b>部位状態</b><div class="d">部位の数字は残存率。頭は強打が数発入るだけで危険。頭または胴体が尽きると死亡する。</div><div class="tagrow">${Object.entries(S.body).map(([k,v])=>`<span class="tag ${partRatio(k)<.35?'bad':partRatio(k)<.7?'gold':'good'}">${limbLabel(k)} ${partText(k)}</span>`).join('')}</div></div></div></div>`}
function bodyHtml(){return `<div class="bodyGrid">${Object.entries(S.body).map(([k,v])=>`<div class="partHp"><b>${limbLabel(k)}</b><div class="m">${partText(k)} / ${Math.round(partRatio(k)*100)}%</div><div class="partbar"><i style="width:${Math.round(partRatio(k)*100)}%"></i></div></div>`).join('')}</div>`}
function woundLevel(k){

function compactWound(k){let r=partRatio(k);if((k=='head'&&S.body[k]<=6)||(k=='torso'&&S.body[k]<=10))return '致命';if(r<.25)return '重傷';if(r<.5)return '負傷';if(r<.75)return '軽傷';return '正常'}

function shortLimbLabel(k){return {head:'頭',torso:'胴',larm:'左腕',rarm:'右腕',lleg:'左脚',rleg:'右脚'}[k]||k}

function bodyTemplateForEnemy(e){
 let ep=enemyProfile(e||S.enemy), kind=ep.kind||'human';
 if(kind=='robot')return {head:18,torso:42,larm:24,rarm:24,lleg:22,rleg:22};
 if(kind=='beast')return {head:12,torso:24,larm:14,rarm:14,lleg:14,rleg:14};
 return {head:14,torso:26,larm:14,rarm:14,lleg:14,rleg:14};
}
function enemyLimbLabel(k,e=S.enemy){
 let ep=enemyProfile(e), kind=ep.kind||'human';
 if(kind=='robot')return {head:'センサー',torso:'中枢',larm:'左腕',rarm:'右腕',lleg:'左脚',rleg:'右脚'}[k]||k;
 if(kind=='beast')return {head:'頭',torso:'胴',larm:'前左',rarm:'前右',lleg:'後左',rleg:'後右'}[k]||k;
 return shortLimbLabel(k);

function initEnemyBody(e){

 let max=bodyTemplateForEnemy(e);
 e.bodyMax=max;
 e.body=e.body||clone(max);
 Object.keys(max).forEach(k=>{if(e.body[k]===undefined)e.body[k]=max[k];e.body[k]=clamp(e.body[k],0,max[k])});
 if(!e.max)e.max=max.torso+max.head;
}
function enemyPartRatio(k,e=S.enemy){initEnemyBody(e);return clamp((e.body[k]||0)/(e.bodyMax[k]||1),0,1)}
function enemyDerivedHp(e=S.enemy){

}
function syncEnemyHp(e=S.enemy){

function enemyDead(e=S.enemy){

function enemyArmorProfilePart(k,e=S.enemy){

}
function playerArmorProfilePart(k){
 let arr=[];
 if(k=='head')arr=[S.eq.head];
 else if(k=='torso')arr=[S.eq.body,S.eq.outer];
 else if(k=='larm'||k=='rarm')arr=[S.eq.outer,S.eq.hands];
 else if(k=='lleg'||k=='rleg')arr=[S.eq.outer,S.eq.legs];
 let hard=0,soft=0,defense=0;
 arr.forEach(i=>{if(i){let e=i.effects||{};hard+=e.hard||0;soft+=e.soft||0;defense+=e.defense||0}});
 return {hard,soft:clamp(soft,0,.8),defense};
}
function pickHitPart(mode='normal',target='enemy'){
 let table;
 if(target=='enemy'){
  table = mode=='vital'
   ? [['head',2.2],['torso',3.0],['larm',1],['rarm',1],['lleg',.8],['rleg',.8]]
   : mode=='covered'
    ? [['head',.55],['torso',1.0],['larm',2.0],['rarm',2.0],['lleg',1.8],['rleg',1.8]]
    : [['head',1],['torso',2.2],['larm',1.4],['rarm',1.4],['lleg',1.4],['rleg',1.4]];
 }else{
  table = mode=='vital'
   ? [['head',2.2],['torso',3.0],['larm',1],['rarm',1],['lleg',.8],['rleg',.8]]
   : mode=='covered'
    ? [['head',.55],['torso',1.0],['larm',2.0],['rarm',2.0],['lleg',1.8],['rleg',1.8]]
    : [['head',1],['torso',2.2],['larm',1.4],['rarm',1.4],['lleg',1.4],['rleg',1.4]];
 }
 let sum=table.reduce((a,x)=>a+x[1],0), r=Math.random()*sum;
 for(const [k,w] of table){r-=w;if(r<=0)return k}
 return 'torso';
}
function applyEnemyHit(att,kind='attack',mode='normal',powOverride=null){
 let e=S.enemy;initEnemyBody(e);
 let part=pickHitPart(mode,'enemy');
 let def=enemyArmorProfilePart(part,e);
 let pow=powOverride??actionPower('p',kind=='strong'?'strong':'attack');
 let dmg=damageFromProfile(att,def,pow,kind=='strong'?'strong':'attack');
 dmg=Math.max(1,dmg-armPenalty());
 let mult=(part=='head'?0.85:part=='torso'?1.15:1);
 let actual=Math.max(1,Math.round(dmg*mult));
 let before=e.body[part]||0;
 e.body[part]=clamp(before-actual,0,e.bodyMax[part]);
 syncEnemyHp(e);
 return {part,damage:actual,before,label:`${enemyLimbLabel(part,e)}-${actual}`,dead:enemyDead(e),armor:def};
}
function applyEnemyHitPart(att,kind='attack',part='torso',powOverride=null,bonus=1){
 let e=S.enemy;initEnemyBody(e);part=e.bodyMax[part]!==undefined?part:'torso';
 let def=enemyArmorProfilePart(part,e),pow=powOverride??actionPower('p',kind=='strong'?'strong':'attack');
 let dmg=damageFromProfile(att,def,pow,kind=='strong'?'strong':'attack');dmg=Math.max(1,dmg-armPenalty());
 let mult=(part=='head'?1.08:part=='torso'?1.20:1.0)*bonus,actual=Math.max(1,Math.round(dmg*mult)),before=e.body[part]||0;
 e.body[part]=clamp(before-actual,0,e.bodyMax[part]);syncEnemyHp(e);
 return {part,damage:actual,before,label:`${enemyLimbLabel(part,e)}-${actual}`,dead:enemyDead(e),armor:def};
}
function aimEffectText(part,e=S.enemy){

 // ただし硬さには素直に削られる。硬い防具を最低保証で貫通しない。

function enemyIntentText(i){return {attack:'踏み込んで攻撃してきそうだ。',heavy:'大きく振りかぶっている。重い一撃が来る。',guard:'身を固め、こちらの出方を見ている。',recover:'距離を取り、息を整えようとしている。',feint:'左右に揺れて、こちらの反応を誘っている。',stagger:'肩で息をし、体勢を立て直せていない。'}[i]||'様子をうかがっている。'}
function chooseEnemyIntent(){
 if(!S.enemy)return;let e=S.enemy,cs=combatState(),r=Math.random(),q=(e.sta||0)/(e.maxSta||e.sta||1);
 if(e.exposed){e.intent='stagger';return}
 if(cs.exposed){e.intent=(q>.28&&r<.55)?'heavy':'attack';e.intentExploit=true;return}
 e.intentExploit=false;
 if(q<.30){e.intent='recover';return}
 if(e.hp/e.max<.35&&r<.28){e.intent='guard';return}
 if(q>.55&&r<.22){e.intent='heavy';return}
 if(r<.62){e.intent='attack';return}

 e.intent='guard'
}
function spendSta(who,cost){
 let obj=who=='p'?combatState():S.enemy,before=obj.sta||0;
 obj.sta=clamp(before-cost,0,obj.maxSta||70);
 obj.lastOver=Math.max(0,Math.round(cost-before));
 if(cost>0&&obj.sta<=0){obj.exposed=true;obj.exposedBy=who=='p'?'overwork':'pressure'}
 return cost?clamp(before/cost,0,1):1
}
function gainSta(who,amt){let obj=who=='p'?combatState():S.enemy;obj.sta=clamp((obj.sta||0)+amt,0,obj.maxSta||70)}
function gainStaRatio(who,ratio,min=0){
 let obj=who=='p'?combatState():S.enemy,before=obj.sta||0;
 let amt=Math.max(min,Math.round((obj.maxSta||70)*ratio));

const COMBAT_RATE={attack:.20,strong:.34,feint:.10,dodge:.22,guardAttack:.16,guardStrong:.24,approach:.14,retreat:.16,readPunish:.30};

function combatAction(a){
 if(!S.enemy)return;
 let cs=combatState(),g=gear(),e=S.enemy,intent=e.intent||'attack',line='',incoming=0,part='';
 const actName={strong:'強打',attack:'通常攻撃',feint:'フェイント',dodge:'回避行動',guard:'ガード',relax:'リラックス',approach:'近づく',retreat:'距離を取る',flee:'逃走'}[a]||a;
 line=`${actName}。`;
 if(a!='flee'&&S.combat)S.combat.safeEscape=false;

 if(a=='flee'){

  }

   S.enemy=null;S.combat=null;S.msg=line;log(line);render();closeW();return;
  }else line='逃走に失敗した。';
 }

 if(a=='approach'){

 }

 // Player action / matchup phase
 let playerAttacks = a=='strong'||a=='attack';
 if(a=='strong'){
  let hit=null,dmg=0,attackPow=actionPower('p','strong'),attackPaid=false;
  if(!canHitTarget('p')){line+=` ${distName(S.combat.dist)}では武器が届かない。`;}

   else {

    dmg=hit.damage;
    if(intent=='guard'){let q=spendActionSta('e','guardStrong');dmg=Math.max(1,Math.round(dmg*.62)); e.body[hit.part]=clamp(hit.before-dmg,0,e.bodyMax[hit.part]); syncEnemyHp(e); line+=` 守りの上から叩く。相手は防御でスタミナを消費した。`;}
    if(intent=='recover'){line+=` 立て直しの隙を潰した。`;}
    if(intent=='attack'){line+=` 通常攻撃ごと押し込む。`;}
    line+=` ${e.name}の${hit.label}。`;
   }
  }
 }

 if(a=='attack'){
  let hit=null,dmg=0,attackPow=actionPower('p','attack');
  if(!canHitTarget('p')){line+=` ${distName(S.combat.dist)}では武器が届かない。`;}
  else if(!consumeAmmoForWeapon()){line+=` 弾がない。`;}
  else {
   if(usingUnarmedFallback())line+=` 弾はない。スリングを握ったまま素手で殴る。`;
   spendActionSta('p','attack');
   hit=applyEnemyHit(playerAttackProfile(),'attack',intent=='guard'?'covered':intent=='recover'?'vital':'normal',attackPow);
   dmg=hit.damage;
   if(intent=='guard'){let q=spendActionSta('e','guardAttack');dmg=Math.max(1,Math.round(dmg*.55)); e.body[hit.part]=clamp(hit.before-dmg,0,e.bodyMax[hit.part]); syncEnemyHp(e); line+=` 相手は防御でスタミナを消費した。`;}
   if(intent=='feint'){line+=` 誘いに大きく乗らず、手堅く当てる。`;}
   if(intent=='recover'){line+=` 立て直しの隙を突く。`;}
   line+=` ${e.name}の${hit.label}。`;
  }
 }

 if(a=='feint'){
  let feintCost=spendActionSta('p','feint');

  if(intent=='heavy'){spendActionSta('e','readPunish');line+=` 相手の強打を誘い、空振りさせた。相手のスタミナが大きく落ちる。`;}
  else if(intent=='guard'){spendActionSta('e','readPunish');line+=` 相手は守りを固めすぎ、スタミナを大きく失った。`;}
  else if(a=='feint'&&intent=='attack'){line+=` しかし相手は通常攻撃で踏み込んでくる。読み負けだ。`;}
  else if(intent=='recover'){let rec=gainStaRatio('e',Math.min(.42,combatRecoveryRatio()+.06),6);line+=` 相手は誘いに乗らず息を整えた。スタミナを${rec}回復され、回復合戦で不利になる。`;}
  else if(intent=='feint'){spendActionSta('e','feint');line+=` 互いに様子を探り、双方がわずかに消耗した。`;}
 }

 if(a=='relax'){
  let rr=combatRecoveryRatio()*((intent=='attack'||intent=='heavy')?.45:1),rec=gainStaRatio('p',rr,6);
  line+=` ${distName(S.combat.dist)}で息を整え、スタミナを${rec}回復した。`;
  if(intent=='feint'){let bonus=gainStaRatio('p',.10,6);e.sta=clamp(e.sta-8,0,e.maxSta);line+=` 相手のフェイントに乗らず、さらに${bonus}回復して有利な間合いを作る。`;}
 }

 if(enemyDead(e)){finishCombatWin(line);return}

 // Enemy action phase. Feint itself deals no damage.
 let enemyActs=intent=='attack'||intent=='heavy';
 if(intent=='feint'){
  let enemyFeintCost=spendActionSta('e','feint');
  if(a=='dodge'){let loss=spendActionSta('p','readPunish');line+=` フェイント相手に回避を切ってしまい、読み負けでスタミナを${loss}失った。`;}
  else if(a=='guard'){let loss=spendActionSta('p','readPunish');line+=` フェイントにガードを固めすぎ、スタミナを${loss}失った。`;}
  else if(a=='strong'){/* already penalized above */}
  else if(a=='attack'){line+=` 相手のフェイントは、通常攻撃で崩した。`;}
  else if(a=='relax'){line+=` 相手のフェイントは空振りした。`;}
 }else if(enemyActs){
  let enemyKind=intent=='heavy'?'strong':'attack',enemyPow=actionPower('e',enemyKind),enemyPaid=0;
  if(!canHitTarget('e')){
   if(approachDistance('e'))line+=` ${e.name}がこちらへ詰めてくる。距離: ${distName(S.combat.dist)}。`;
   else line+=` ${e.name}は距離を詰めようとしているが、こちらが距離を保った。`;
   incoming=0;
  }else{
   incoming=1;enemyPaid=spendActionSta('e',enemyKind);
  if(a=='dodge'){
   let pow=actionPower('p','dodge');spendActionSta('p','dodge');
   let baseRate=intent=='heavy'?.78:.50;
   let rate=clamp(baseRate*pow-legPenalty()*.12,0,1);
   line+=` 回避成功率${Math.round(rate*100)}%。`;
   if(chance(rate)){
    line+=` ${e.name}の${intent=='heavy'?'強打':'攻撃'}を回避した。`;
    incoming=0;
    if(intent=='heavy'){spendActionSta('e','readPunish');line+=` 相手は大振りを外し、スタミナを大きく失った。`;}
   }else line+=` 回避しきれない。`;
  }else if(a=='guard'){
   let pow=actionPower('p','guard');
   spendActionSta('p',intent=='heavy'?'guardStrong':'guardAttack');
   let reduce=(intent=='heavy'?.54:.72)*pow;
   incoming=Math.max(0,Math.round(incoming*(1-reduce)));
   line+=` ガードで衝撃を${Math.round(reduce*100)}%殺した。`;
  }else if(a=='feint'){
   // Feint has no damage and is weak to normal attack, but it can bait heavy.
   if(intent=='heavy'){incoming=0;}
   else incoming=Math.max(1,Math.round(incoming*1.05));
  }else if(a=='relax'){
   incoming=Math.max(1,Math.round(incoming*1.12));
   line+=` 無防備なところを狙われる。`;
  }
  }
  if(incoming>0){let exploit=!!cs.exposed,mode=exploit?'vital':(a=='guard'?'covered':a=='dodge'?'vital':'normal'),eh=applyPlayerHit(enemyAttackProfile(),intent=='heavy'?'strong':'attack',mode,enemyPow*(exploit?1.18:1));incoming=eh.damage;part=eh.label;line+=` ${e.name}の${intent=='heavy'?'強打':'攻撃'}。${exploit?'疲弊の隙を突かれた。':''}${part}。`;if(exploit){cs.exposed=cs.sta<=0;cs.exposedBy=cs.exposed?'exhausted':'';}fx('damage','-'+incoming);}
 }else if(intent=='guard'){
  line+=` ${e.name}は守りを固めた。`;
 }else if(intent=='recover'){
  let pressure=(playerAttacks||a=='approach'),rr=pressure?.08:combatRecoveryRatio(),rec=gainStaRatio('e',rr,4);

 }else if(intent=='stagger'){
  line+=` ${e.name}は息が上がり、体勢を立て直せない。`;
 }

 if(a=='dodge'&&!enemyActs&&intent!='feint'){spendActionSta('p','dodge');line+=` 攻撃は来ず、回避は空回りした。`}
 if(a=='guard'&&!enemyActs&&intent!='feint'){line+=` 攻撃は来なかったため、スタミナ消費は抑えられた。`}
 syncHealth();line+=combatRegenTick();let warn=vitalWarning();if(warn.length)line+=` 警告: ${warn.join(' / ')}。`;line+=` 自ST ${Math.round(cs.sta)}（${staminaState('p').name}） / 敵ST ${Math.round(e.sta)}（${staminaState('e').name}）。`;
 if(intent=='stagger'&&e.exposed)e.exposed=false;
 if(cs.exposed&&cs.sta>=(cs.maxSta||70)*.30&&!(intent=='attack'||intent=='heavy'))cs.exposed=false;
 S.combatLog.unshift(line);S.msg=line;log(line);
 if(S.body.head<=0||S.body.torso<=0){alert('力尽きた。');S.enemy=null;S.combat=null;newGame();return}
 S.combat.turn=(S.combat.turn||1)+1;chooseEnemyIntent();render();openW('combat')
}

/* ===== Dice combat prototype V4 - simplified distance =====
   Stamina is 0..5 discrete dice.
   Allocate current dice to attack / defense / recover, resolve simultaneously.
   Attack vs defense uses highest d6. Equipment stats decide wound severity after a hit.
*/
function dicePoolText(cur,max=5){cur=clamp(Math.round(cur||0),0,max);return `<span class="dieOn">${'●'.repeat(cur)}</span><span class="dieOff">${'○'.repeat(Math.max(0,max-cur))}</span>`}
function rollDicePool(n){n=Math.max(0,Math.round(n||0));let rolls=[];for(let i=0;i<n;i++)rolls.push(1+Math.floor(Math.random()*6));return {rolls,best:rolls.length?Math.max(...rolls):0}}
function diceRollText(r){return r.rolls.length?`[${r.rolls.join(',')}]→${r.best}`:'[—]→0'}
function recoveryFromBest(best){return best>0?Math.ceil(best/2):0}
function playerStartDice(){let f=S.p?.fatigue||0;return f>=75?3:f>=45?4:5}
function trimCombatAlloc(){let cs=S.combat;if(!cs)return;cs.alloc=cs.alloc||{attack:Math.min(2,cs.sta||0),defense:Math.min(1,Math.max(0,(cs.sta||0)-2)),recover:0};for(const k of ['attack','defense','recover'])cs.alloc[k]=clamp(Math.round(cs.alloc[k]||0),0,5);let sum=cs.alloc.attack+cs.alloc.defense+cs.alloc.recover;while(sum>(cs.sta||0)){if(cs.alloc.recover>0)cs.alloc.recover--;else if(cs.alloc.attack>1)cs.alloc.attack--;else if(cs.alloc.defense>0)cs.alloc.defense--;else if(cs.alloc.attack>0)cs.alloc.attack--;sum--}}
function defaultCombatAlloc(){let cs=combatState(),n=cs.sta||0;cs.alloc={attack:Math.min(2,n),defense:Math.min(1,Math.max(0,n-2)),recover:0};trimCombatAlloc()}
function combatState(){
 if(!S.combat)S.combat={sta:5,maxSta:5,turn:1,dist:0,alloc:{attack:2,defense:1,recover:0}};
 // migrate a combat that was saved with the old 70-point stamina system
 if((S.combat.maxSta||0)>5){let q=clamp((S.combat.sta||0)/(S.combat.maxSta||70),0,1);S.combat.maxSta=5;S.combat.sta=clamp(Math.ceil(q*5),1,5);S.combat.alloc=null}
 S.combat.maxSta=5;S.combat.sta=clamp(Math.round(S.combat.sta??5),0,5);
 if(S.enemy){
  if((S.enemy.maxSta||0)>5){let q=clamp((S.enemy.sta||0)/(S.enemy.maxSta||55),0,1);S.enemy.maxSta=5;S.enemy.sta=clamp(Math.ceil(q*5),1,5)}
  S.enemy.maxSta=5;S.enemy.sta=clamp(Math.round(S.enemy.sta??5),0,5)
 }
 trimCombatAlloc();return S.combat
}
function gainSta(who,amt){let obj=who=='p'?combatState():S.enemy;if(!obj)return;obj.maxSta=5;obj.sta=clamp(Math.round((obj.sta||0)+amt),0,5);if(who=='p')trimCombatAlloc()}
function combatRegenTick(){if(!S.combat)return '';let txt='';if(S.combat.stimTurns>0){gainSta('p',1);S.combat.stimTurns--;txt=' エナジードリンクの効果で追加ST+1。'}return txt}
function staminaState(who){let obj=who=='p'?combatState():S.enemy,cur=obj?.sta||0;if(cur<=0)return {key:'gasp',name:'息切れ'};if(cur<=1)return {key:'gasp',name:'限界'};if(cur<=2)return {key:'tired',name:'消耗'};return {key:'fresh',name:'余裕'}}
function staminaStateHtml(who){let st=staminaState(who);return `<span class="staState ${st.key}">${st.name}</span>`}

function combatAdjust(kind,delta){let cs=combatState();if(!['attack','defense','recover'].includes(kind))return;let next=clamp((cs.alloc[kind]||0)+delta,0,5),other=cs.alloc.attack+cs.alloc.defense+cs.alloc.recover-(cs.alloc[kind]||0);if(other+next>cs.sta)return;cs.alloc[kind]=next;openW('combat')}
function combatAllocUsed(a){return (a.attack||0)+(a.defense||0)+(a.recover||0)}
function combatReserve(){let cs=combatState();return Math.max(0,cs.sta-combatAllocUsed(cs.alloc))}

function chooseEnemyIntent(){
 if(!S.enemy)return;let e=S.enemy,sta=clamp(e.sta||0,0,5),r=Math.random(),hp=syncEnemyHp(e)/(e.max||1),p={attack:0,defense:0,recover:0},stance='均衡';
 // 距離は独立した行動ではない。射程外の近接側は、防御・回復をしながらターン終了時に自動接近する。
 if((S.combat?.dist??0)>0&&!rangeCanAttack(enemyAttackProfile(),S.combat.dist)){
  stance='接近';p.defense=Math.min(sta,Math.min(2,sta));p.recover=Math.min(Math.max(0,sta-p.defense),1);
 }
 else if(sta<=1||hp<.38){stance='立て直し';p.recover=Math.min(2,sta);p.defense=Math.min(sta-p.recover,1)}
 else if(r<.30){stance='攻勢';p.attack=Math.min(sta,3);p.defense=Math.min(sta-p.attack,1)}
 else if(r<.55){stance='守勢';p.defense=Math.min(sta,3);p.attack=Math.min(sta-p.defense,1)}
 else if(r<.75){stance='立て直し';p.recover=Math.min(sta,2);p.defense=Math.min(sta-p.recover,2)}
 else {stance='均衡';p.attack=Math.min(sta,2);p.defense=Math.min(sta-p.attack,2);p.recover=Math.min(sta-p.attack-p.defense,1)}
 // occasionally keep one die in reserve; exact allocation is intentionally hidden until resolution
 let used=combatAllocUsed(p);if(sta-used>0&&chance(.55)){}else if(used==sta&&sta>=4&&stance!='攻勢'){if(p.defense>1)p.defense--;else if(p.recover>1)p.recover--}

 }

  if(e.lockpick)score+=75;
  if(e.canOpener){score+=18;risk.push('代用。少し時間がかかる')}
 }
 if(kind=='pry'){
  if(it.base.includes('バール'))score+=70;
  if(e.craft)score+=25+e.craft*8;
  if(it.type=='weapon'&&(e.heavy||0)>4){score+=28;risk.push('荒っぽく、音が出る')}

 let storageOk=baseAtPlayer();
 let btn='';
 if(mode=='loot')btn=`<button onclick="take('${it.id}')">回収</button>`;
 else if(mode=='stash')btn=`<button ${storageOk?`onclick="unstashItem('${it.id}')"`:'disabled'}>${storageOk?'取り出す':'拠点不在'}</button>`;
 else if(mode=='combatItem'){
  let ok=isCombatUsable(it);
  btn=`<button ${ok?`onclick="use('${it.id}')"`:'disabled'}>${ok?useLabel(it):'戦闘不可'}</button><button class="flat" onclick="openW('combat')">戻る</button>`;
 }else{
  if(isMaterialItem(it))btn=`<button disabled>素材</button><button class="flat" ${storageOk?`onclick="stashItem('${it.id}')"`:'disabled'}>${storageOk?'保管':'拠点不在'}</button><button class="flat" onclick="drop('${it.id}')">置く</button>`;
  else btn=`<button onclick="use('${it.id}')">${useLabel(it)}</button><button class="flat" ${storageOk?`onclick="stashItem('${it.id}')"`:'disabled'}>${storageOk?'保管':'拠点不在'}</button><button class="flat" onclick="drop('${it.id}')">置く</button>`;
 }
 return`<div class="item compactItem ${c}"><b>${itemIcon(it.type)} ${it.name}${itemQty(it)>1?' ×'+itemQty(it):''}</b><div class="m">${tn[it.type]} / ${itemTotalWeight(it)}kg${itemQty(it)>1?'（1個'+it.weight+'kg）':''} / ${sizeText(it)} / 価値${itemTotalValue(it)}</div><div class="d">${it.desc}</div>${mode=='combatItem'?`<div class="m">${combatUsableReason(it)}</div>`:''}<div class="tagrow">${tags(it)}</div><div class="row">${btn}</div></div>`
}

function needText(need){return Object.entries(need).map(([k,v])=>`${k}×${v}`).join(' / ')}

 return Object.entries(need).map(([k,v])=>`${k}:${mats[k]||0}/${v}`).join(' / ');
}
function baseUpgradeCard(key){

else if(k=='status'){$('#wt').textContent='状態';let g=gear(),meds=S.inv.filter(i=>i.type=='med');$('#tb').innerHTML=S.enemy?`<button class="flat" onclick="openW('combat')">戦闘へ戻る</button>`:'';$('#bd').innerHTML=`<div class="list">${survivalPressureHtml()}<div class="item"><b>生存状態</b><div class="d">満腹${goodStat('hunger')} / 水分${goodStat('thirst')} / 活力${goodStat('fatigue')} / 士気${goodStat('morale')} / 清浄${goodStat('infection')} / ${conditionLine()}</div></div><div class="item"><b>部位状態</b>${bodyPictogram()}</div><div class="item"><b>治療</b><div class="d">所持している医療品を選び、次に治療部位を指定する。</div><div class="row">${meds.length?meds.map(i=>`<button onclick="use('${i.id}')">${itemIcon(i.type)} ${i.name}</button>`).join(''):'<button disabled>医療品なし</button>'}</div></div><div class="item"><b>装備補正</b><div class="d">鋭${g.sharp||0} / 重${g.heavy||0} / 防御+${g.d} / 硬${g.hard||0} / 柔${Math.round((g.soft||0)*100)}% / 探索+${g.s}</div></div></div>`}
else if(k=='cook'){$('#wt').textContent='クラフト';let foods=S.inv.filter(i=>['food','water','meal'].includes(i.type));let rec=craftRecipes();$('#tb').innerHTML=`<span class="chip ${hasEff('canOpener')?'good':'bad'}">缶切り:${hasEff('canOpener')?'あり':'なし'}</span><span class="chip ${hasEff('cookHeat')?'good':'bad'}">加熱:${hasEff('cookHeat')?'可':'不可'}</span><span class="chip ${hasCuttingTool()?'good':'bad'}">切断:${hasCuttingTool()?'可':'不可'}</span>`;$('#bd').innerHTML=`<h3>クラフト</h3><div class="list">${rec.map(r=>`<div class="item craftRecipe ${r.ready?'ready':'locked'}"><b>${r.name}</b><div class="d">${r.desc}</div><div class="needLine">必要: ${r.need}</div><div class="row"><button class="primary" ${r.ready?`onclick="craftRecipes().find(x=>x.id=='${r.id}').action()"`:'disabled'}>${r.ready?'作る':'材料不足'}</button></div></div>`).join('')}</div><h3>料理・煮沸</h3><div class="item"><b>水の煮沸</b><div class="d">水だけを選んで「加熱/煮沸」を押すと、煮沸した水になる。</div></div><div class="list">${foods.length?foods.map(i=>`<label class="item selectLine"><input type="checkbox" data-cook value="${i.id}"><div><b>${itemIcon(i.type)} ${i.name}</b><div class="m">${tn[i.type]} / ${i.weight}kg</div><div class="tagrow">${tags(i)}</div></div></label>`).join(''):'<div class="item">料理・煮沸できる素材がない。</div>'}</div>`;$('#ft').innerHTML=`<button class="primary" onclick="cookSelected(true)">加熱/煮沸</button><button onclick="cookSelected(false)">混ぜるだけ</button>`}

else if(k=='toolSelect'){
 let p=S.pendingToolAction||{}, kind=p.kind||'cut';
 $('#wt').textContent=`道具を選ぶ：${toolUseKindLabel(kind)}`;
 let opts=toolsForKind(kind);
 if(kind=='heat'&&baseReady('kitchen')&&vehicleActiveHere())opts.unshift({it:{id:'baseKitchen',name:'拠点調理台',type:'tool',weight:0,value:0,dur:100,effects:{cookHeat:true}},score:95,risk:[]});
 let back=(p.action=='clearEdge'||p.action=='resolveObject')?'actions':p.action&&p.action.startsWith('cook')?'cook':'scrapCloth'; $('#tb').innerHTML=`<span class="chip">${toolUseKindLabel(kind)}</span><button class="flat" onclick="openW('${back}')">戻る</button>`;
 $('#bd').innerHTML=`<div class="list">${opts.length?opts.map((x,i)=>`<div class="item toolChoice ${i==0?'recommended':''}"><b>${itemIcon(x.it.type)} ${x.it.name}${i==0?'<span class="toolUseBadge">推奨</span>':''}</b><div class="d">${toolOptionDesc(x,kind)}</div><div class="m">${tn[x.it.type]||'道具'} / ${x.it.weight||0}kg${x.it.dur!==undefined?' / 耐久'+Math.round(x.it.dur):''}</div><div class="tagrow">${x.it.id=='baseKitchen'?'':tags(x.it)}</div><div class="row"><button class="primary" onclick="useToolForPending('${x.it.id}')">これを使う</button></div></div>`).join(''):'<div class="item">使える道具がない。</div>'}</div>`;
}
else if(k=='scrapCloth'){$('#wt').textContent='布製品を解体';let items=S.inv.filter(i=>['clothing','container'].includes(i.type)&&i.base!='布切れ');$('#tb').innerHTML=`<span class="chip ${hasCuttingTool()?'good':'bad'}">切断道具:${hasCuttingTool()?'あり':'なし'}</span><button class="flat" onclick="openW('cook')">クラフトへ</button>`;$('#bd').innerHTML=`<div class="list">${items.length?items.map(i=>`<div class="item"><b>${itemIcon(i.type)} ${i.name}</b><div class="m">${tn[i.type]} / ${i.weight}kg / 耐久${i.dur}</div><div class="d">解体して布切れにする。実行時に使う切断道具を選ぶ。</div><div class="tagrow">${tags(i)}</div><div class="row"><button class="primary" ${hasCuttingTool()?`onclick="scrapClothItem('${i.id}')"`:'disabled'}>道具を選んで解体</button></div></div>`).join(''):'<div class="item">解体できる布製品がない。</div>'}</div>`}
else if(k=='ground'){
 $('#wt').textContent='周辺物資';
 let groundBase=cur().loot, arr=itemFilter(itemSort(groundBase,S.sort?.ground||'recent'),'ground');
 let foundHtml=S.preview&&S.preview.length
  ? `<div class="item gooditem"><b>直近で発見</b><div class="d">${S.preview.join(' / ')}</div></div>`
  : '';
 $('#tb').innerHTML=`<span class="chip">${locationIcon(cur().l,'svgIcon chipIcon')} ${cur().l.n}</span><span class="chip">${arr.length}/${groundBase.length}個</span>`+filterButtons('ground',groundBase)+sortButtons('ground');
 $('#bd').innerHTML=`${foundHtml}${objectsHtml()}<div class="list">${arr.length?arr.map(i=>card(i,'loot')).join(''):'<div class="item">表示できる周辺物資はない。</div>'}</div>`;
 $('#ft').innerHTML=groundBase.length?`<button class="primary" onclick="takeAllVisible()">取れるだけ回収</button><button onclick="openW('explore')">さらに探索</button>`:`<button onclick="openW('explore')">探索する</button>`;
}
else if(k=='actions'){$('#wt').textContent='行動';$('#tb').innerHTML=`<span class="chip">${locationIcon(cur().l,'svgIcon chipIcon')} ${cur().l.n}</span><span class="chip">現在地タップでも探索</span><span class="chip ${unresolvedObjects(cur()).length?'gold':''}">未解決 ${unresolvedObjects(cur()).length}</span>`;$('#bd').innerHTML=`${survivalPressureHtml()}${objectiveCardHtml()}${adjacentRoutesHtml()}${edgeObstacleCards()}${objectsHtml()}<div class="list">
<div class="item"><b>探索</b><div class="d">現在地の探索箇所を選ぶ。こっそり・通常・大々的から方針を選べる。</div><div class="row"><button class="primary" onclick="openW('explore')">探索する</button></div></div>
<div class="item"><b>周辺物資</b><div class="d">この場所に残っている未回収の物資を見る。</div><div class="row"><button onclick="openW('ground')">周辺物資を見る</button></div></div>
<div class="item"><b>休憩</b><div class="d">60〜90分休んで疲労を回復する。拠点は安全で効果が高く、野外では遭遇の可能性がある。</div><div class="row"><button class="green" onclick="rest();openW('actions')">休憩する</button></div></div>
<div class="item"><b>待機</b><div class="d">30分動かずに警戒し、周辺の気配を大きく下げる。</div><div class="row"><button onclick="wait();openW('actions')">待機する</button></div></div>
<div class="item"><b>ログ</b><div class="d">詳細ログを開く。直近3行は各画面下部にも常時表示される。</div><div class="row"><button class="flat" onclick="openW('log')">ログを見る</button></div></div>
</div>`}

else if(k=='log'){$('#wt').textContent='ログ';$('#bd').innerHTML=S.log.map(x=>`<div class="item"><div class="d">${x}</div></div>`).join('') || '<div class="item">ログなし。</div>'}
}

function mergeUpgradeState(old){let out=clone(baseUpgrades);for(const k of Object.keys(out))if(old?.[k])out[k]={...out[k],...old[k]};return out}
function migrateState(s){
 if(!s||typeof s!='object')throw new Error('invalid save');
 s.version=GAME_VERSION;s.inv=mergeAmmoStacks((s.inv||[]).map(normalizeItem));s.stash=mergeAmmoStacks((s.stash||[]).map(normalizeItem));s.loot=mergeAmmoStacks((s.loot||[]).map(normalizeItem));s.eq=s.eq||{};
 if(s.eq.weapon){let legacy=normalizeItem(s.eq.weapon),dest=weaponSlotOf(legacy);if(!s.eq[dest])s.eq[dest]=legacy;else s.inv=addStacked(s.inv,legacy);delete s.eq.weapon}
 Object.keys(slotName).forEach(k=>{if(s.eq[k])normalizeItem(s.eq[k]);else if(s.eq[k]===undefined)s.eq[k]=null});
 s.filter=s.filter||{inv:'all',ground:'all',base:'all'};s.sort=s.sort||{};s.alert=clamp(Number(s.alert??8),0,100);s.log=s.log||[];s.preview=s.preview||[];s.combatLog=s.combatLog||[];s.lastCombatResult=s.lastCombatResult||null;s.body=s.body||clone(BODY_MAX);s.base=s.base||{name:'壊れたリアカー',mode:'broken',x:s.p?.x||8,y:s.p?.y||8,storage:18,wear:40,up:clone(baseUpgrades)};s.base.up=mergeUpgradeState(s.base.up);
 if(s.map?.length){s.map.flat().forEach(t=>{if(!t)return;t.seen=!!t.seen;t.visited=!!t.visited||(t.x==s.p.x&&t.y==s.p.y);t.loot=mergeAmmoStacks((t.loot||[]).map(normalizeItem));t.spots=t.spots||genSpots(t.l);t.spots.forEach(sp=>{sp.searches=sp.searches??(sp.used?1:0)});ensureObjects(t)});}
 if(!s.edges||Object.keys(s.edges).length<100){let prev=S;S=s;generateEdges();s.edges=S.edges;S=prev}else Object.values(s.edges).forEach(e=>{e.state=e.state||'pass';e.cost=e.cost||45;e.cart=!!e.cart;if(e.state=='obstacle')e.need=e.need||'pry'});
 return s;
}
let autosaveTimer=null,sessionActive=false;
function saveSilent(force=false){
 try{
  if(!S||(!sessionActive&&!force))return false;
  S.version=GAME_VERSION;S.savedAt=Date.now();
  localStorage.setItem(KEY,JSON.stringify(S));
  return true;
 }catch(err){console.warn('autosave failed',err);return false}
}
function queueAutosave(){if(!sessionActive)return;clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>saveSilent(false),180)}
function closeW(){if(S.enemy){openW('combat');return}document.body.classList.remove('combatMode');$('#ov').classList.remove('open')}
function save(){let ok=saveSilent(true);S.msg=ok?'保存した。':'保存に失敗した。';render()}
function load(){let r=null;try{r=localStorage.getItem(KEY)}catch(err){console.error(err);return false}if(!r)return false;try{S=migrateState(JSON.parse(r));render();return true}catch(err){console.error(err);S.msg='保存データの読み込みに失敗した。';return false}}
function saveMeta(){try{let r=localStorage.getItem(KEY);if(!r)return null;let d=JSON.parse(r);return {savedAt:d.savedAt||0,turn:d.turn||0,cityName:d.cityName||''}}catch(err){return null}}
function updateContinueButton(){let b=$('#continue'),m=saveMeta();if(!b)return;if(m){b.disabled=false;b.textContent='続きから';b.title=m.savedAt?`最終保存: ${new Date(m.savedAt).toLocaleString()}`:'保存データあり'}else{b.disabled=true;b.textContent='セーブなし';b.title='保存データがありません'}}
window.addEventListener('beforeunload',()=>{if(sessionActive)saveSilent(false)});
$('#new').onclick=()=>{clearTimeout(autosaveTimer);sessionActive=true;$('#title').style.display='none';newGame();saveSilent(false)};
$('#continue').onclick=()=>{clearTimeout(autosaveTimer);sessionActive=true;$('#title').style.display='none';if(!load()){newGame();S.msg='保存データを読み込めなかったため、新規開始した。';render();saveSilent(false)}};
$('#save').onclick=save;$('#load').onclick=()=>{if(!load()){S.msg='保存データがない。';render()}};$('#scav').onclick=openExplore;$('#rest').onclick=rest;$('#wait').onclick=wait;$('#map').onclick=e=>{let b=e.target.closest('.cell');if(!b||b.dataset.x===undefined)return;let x=+b.dataset.x,y=+b.dataset.y,dx=x-S.p.x,dy=y-S.p.y;if(dx==0&&dy==0)openW('explore');else if(Math.abs(dx)+Math.abs(dy)==1)move(dx,dy);else{S.msg='隣接マスだけ移動できる。現在地タップで探索。';render()}};document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>openW(b.dataset.w));$('#close').onclick=closeW;$('#globalLogBtn').onclick=()=>openW('log');$('#ov').onclick=e=>{if(e.target.id=='ov')closeW()};document.addEventListener('click',e=>{let b=e.target.closest('[data-equip-id]');if(b){use(b.dataset.equipId);openW('equip')}});
// 起動時は背景描画用の仮状態だけ作る。sessionActive=false のため保存は絶対に行わない。
newGame();updateContinueButton();
</script>
